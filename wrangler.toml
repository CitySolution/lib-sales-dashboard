# Cloudflare Pages project for the Latest in Beauty sales dashboard.
# Deployed by .github/workflows/deploy.yml on every push to main.
name = "lib-sales-dashboard"
pages_build_output_dir = "site"
compatibility_date = "2026-07-01"

# Where the figures and box costs live (written by /api/upload and /api/costs).
# Namespace "lib-sales-dashboard-data", created 16 Oct 2026.
[[kv_namespaces]]
binding = "LIB_DATA"
id = "6d1ef1d744dd4ee4ae7f964ad8bbb83d"

# Cloudflare Access login. Neither value is secret. Until both are filled in,
# the site serves no data at all (/api/me answers 503).
#   TEAM_DOMAIN: https://<your-team>.cloudflareaccess.com
#   POLICY_AUD:  the Access application's "Application Audience (AUD) Tag"
[vars]
TEAM_DOMAIN = "https://elb-dashboard-pages.cloudflareaccess.com"
POLICY_AUD = ""
