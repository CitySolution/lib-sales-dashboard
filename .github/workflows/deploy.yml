name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci --no-audit --no-fund

      # The TikTok reader and P&L maths must give the hand-worked figures, and only
      # verified @citysolution.co.uk / @latestinbeauty.com sign-ins may get data.
      - name: Test
        run: npm test

      # Says in plain English which credential is wrong, without printing either.
      - name: Check Cloudflare credentials
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && exit 0  # not set up yet: the deploy step says so
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "Token length: ${#CLOUDFLARE_API_TOKEN} characters (Cloudflare API tokens are usually 40). Account ID length: ${#CLOUDFLARE_ACCOUNT_ID} (should be 32)."
          if [ "$CLOUDFLARE_ACCOUNT_ID" != "$(echo "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" ] || [ "$CLOUDFLARE_API_TOKEN" != "$(echo "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" ]; then
            echo "::error::A secret has a space or line break in it - paste it again without one."; exit 1
          fi
          # User tokens and account-owned tokens are verified at different addresses.
          if ! { api /user/tokens/verify; api "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; } | grep -Eq '"status": ?"active"'; then
            echo "::error::Cloudflare doesn't recognise CLOUDFLARE_API_TOKEN as an active API token for this account. Check it's the token value shown once after 'Create Token' (not its name or the Global API Key)."; exit 1
          fi
          echo "Token is valid and active."
          if ! api "/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" | grep -Eq '"success": ?true'; then
            echo "::error::The token is valid but can't use Cloudflare Pages on account CLOUDFLARE_ACCOUNT_ID. Either the account ID is wrong (copy it from Workers & Pages), or the token lacks 'Account > Cloudflare Pages > Edit' for that account."; exit 1
          fi
          echo "Token can use Cloudflare Pages on this account."

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set yet - tests passed, nothing deployed. See SETUP.md."
            exit 0
          fi
          if grep -q REPLACE_WITH_KV_NAMESPACE_ID wrangler.toml; then
            echo "::warning::wrangler.toml has no KV namespace ID yet - tests passed, nothing deployed. See SETUP.md step 2."
            exit 0
          fi
          npx wrangler pages project list | grep -q "lib-sales-dashboard" || npx wrangler pages project create lib-sales-dashboard --production-branch main
          npx wrangler pages deploy --project-name lib-sales-dashboard --branch main --commit-dirty=true
